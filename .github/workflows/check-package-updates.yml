name: Check Package Updates

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      fail_on_outdated:
        description: 'Fail the workflow if outdated packages are found'
        type: boolean
        required: false
        default: false
      fail_on_deprecated:
        description: 'Fail the workflow if deprecated packages are found'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-packages:
    name: Check Outdated Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package update check
        id: check_updates
        run: node scripts/check-package-updates.mjs
        env:
          FAIL_ON_OUTDATED: ${{ github.event.inputs.fail_on_outdated || 'false' }}
          FAIL_ON_DEPRECATED: ${{ github.event.inputs.fail_on_deprecated || 'false' }}

      - name: Post check notification
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          echo "::notice title=Package Updates Available::Found ${{ steps.check_updates.outputs.total_outdated }} outdated package(s) (${{ steps.check_updates.outputs.major_count }} major, ${{ steps.check_updates.outputs.deprecated_count }} deprecated). See Job Summary for detailed breakdown."
